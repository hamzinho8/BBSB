name: BlackBerry OS 7 Build Automatisé

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (Version 32-bit requise pour BlackBerry)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: x86

    - name: Download and Install BlackBerry JDE SDK
      shell: powershell
      run: |
        echo "Téléchargement du BlackBerry JDE officiel (.exe)..."
        # On télécharge l'exécutable officiel car le ZIP n'existe pas sur archive.org
        Invoke-WebRequest -Uri "https://archive.org/download/blackberry-jde-5.0.0/BlackBerry_JDE_5.0.0.exe" -OutFile "jde_installer.exe"
        
        echo "Installation silencieuse du JDE (Patientez...)"
        # Les installeurs BlackBerry utilisaient InstallShield. /s /v"/qn" lance l'installation en arrière-plan sans fenêtre
        Start-Process -FilePath ".\jde_installer.exe" -ArgumentList "/s /v`"/qn`"" -Wait
        
        # Le chemin d'installation par défaut sur les systèmes 64-bits
        $defaultPath = "C:\Program Files (x86)\Research In Motion\BlackBerry JDE 5.0.0"
        
        if (Test-Path $defaultPath) {
            echo "Installation réussie dans $defaultPath !"
            # On crée un lien symbolique pour simplifier la variable d'environnement
            New-Item -ItemType Junction -Path "C:\BlackBerry_JDE" -Target $defaultPath
        } else {
            echo "Avertissement: Le dossier d'installation n'a pas été trouvé. Recherche de rapc.exe..."
            $rapcPath = (Get-ChildItem -Path "C:\" -Filter "rapc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).Directory.Parent.FullName
            if ($rapcPath) {
                echo "JDE trouvé à l'emplacement: $rapcPath"
                New-Item -ItemType Junction -Path "C:\BlackBerry_JDE" -Target $rapcPath
            } else {
                echo "Échec total de l'installation du JDE."
                exit 1
            }
        }

    - name: Compilation avec Apache Ant
      shell: bash
      env:
        BLACKBERRY_JDE_HOME: "C:\\BlackBerry_JDE"
      run: |
        cd blackberry
        
        # On retire les fausses données générées (Mocking). La compilation DOIT réussir maintenant.
        ant build

    - name: Upload Artifacts (Fichiers d'installation)
      uses: actions/upload-artifact@v4
      with:
        name: BlackBerrySmartBridge_App
        path: |
          blackberry/*.cod
          blackberry/*.jad
          blackberry/*.alx
