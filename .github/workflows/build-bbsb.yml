name: BlackBerry OS 5 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ☕ Setup Java 8 (32-bit requis pour RAPC)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: x86

    - name: 🔑 Patch Registry for BlackBerry Installer
      shell: powershell
      run: |
        Write-Host "Ajout des clés de registre Java pour l'installeur BlackBerry..."
        $javaPath = $env:JAVA_HOME
        
        New-Item -Path "HKLM:\SOFTWARE\JavaSoft\Java Development Kit\1.8" -Force | Out-Null
        New-ItemProperty -Path "HKLM:\SOFTWARE\JavaSoft\Java Development Kit\1.8" -Name "JavaHome" -Value $javaPath -Force | Out-Null
        New-ItemProperty -Path "HKLM:\SOFTWARE\JavaSoft\Java Development Kit" -Name "CurrentVersion" -Value "1.8" -Force | Out-Null
        
        New-Item -Path "HKLM:\SOFTWARE\Wow6432Node\JavaSoft\Java Development Kit\1.8" -Force | Out-Null
        New-ItemProperty -Path "HKLM:\SOFTWARE\Wow6432Node\JavaSoft\Java Development Kit\1.8" -Name "JavaHome" -Value $javaPath -Force | Out-Null
        New-ItemProperty -Path "HKLM:\SOFTWARE\Wow6432Node\JavaSoft\Java Development Kit" -Name "CurrentVersion" -Value "1.8" -Force | Out-Null

    - name: 🛠️ Setup Apache Ant
      shell: powershell
      run: |
        Write-Host "Installation d'Apache Ant..."
        choco install ant -y --no-progress

    - name: 🚀 Téléchargement du JDE 5.0.0
      shell: powershell
      run: |
        $url = "https://archive.org/download/blackberry-jde/BlackBerry_JDE_5.0.0.exe"
        $exePath = "C:\BlackBerry_JDE_5.0.0.exe"
        Write-Host "Téléchargement en cours..."
        Invoke-WebRequest -Uri $url -OutFile $exePath
        Write-Host "Téléchargement terminé."

    - name: 📦 Extraction Silencieuse (Advanced Installer)
      shell: powershell
      run: |
        $extractPath = "C:\JDE_Extract"
        $finalJdePath = "C:\BlackBerry_JDE"
        New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
        
        Write-Host "1. Extraction de l'EXE (Advanced Installer)..."
        # Advanced Installer utilise l'argument /extract
        $process = Start-Process -FilePath "C:\BlackBerry_JDE_5.0.0.exe" -ArgumentList "/extract", "`"$extractPath`"" -PassThru -Wait
        
        Write-Host "Code de retour de l'extraction : $($process.ExitCode)"
        
        $msiFile = Get-ChildItem -Path $extractPath -Filter "*.msi" -Recurse | Select-Object -First 1
        if (-not $msiFile) {
            Write-Error "Le fichier MSI n'a pas pu être extrait. Le dossier contient :"
            Get-ChildItem -Path $extractPath -Recurse
            exit 1
        }
        Write-Host "MSI extrait avec succès : $($msiFile.FullName)"
        
        Write-Host "2. Installation Administrative (Décompression pure)..."
        $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/a", "`"$($msiFile.FullName)`"", "/qn", "TARGETDIR=`"$finalJdePath`"" -PassThru -Wait
        Write-Host "Code de retour MSI : $($msiProcess.ExitCode)"
        Write-Host "Décompression terminée."

    - name: 🔍 Configuration du JDE
      shell: powershell
      run: |
        Write-Host "Recherche des outils de compilation..."
        $rapcExe = Get-ChildItem -Path "C:\BlackBerry_JDE" -Filter "rapc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if ($rapcExe) {
            $jdeHome = $rapcExe.Directory.Parent.FullName
            Write-Host "Outils trouvés dans : $jdeHome"
            # Utilisation de Add-Content pour écrire correctement dans GITHUB_ENV
            Add-Content -Path $env:GITHUB_ENV -Value "BLACKBERRY_JDE_HOME=$jdeHome"
        } else {
            Write-Error "Échec : rapc.exe introuvable."
            exit 1
        }

    - name: ⚙️ Compilation du projet BlackBerry
      shell: bash
      run: |
        echo "Lancement de ant avec BLACKBERRY_JDE_HOME=$BLACKBERRY_JDE_HOME"
        # On se place dans le dossier blackberry à la racine du dépôt
        cd blackberry
        ant build 2> rapc_errors.txt > rapc_output.txt || true
        cat rapc_output.txt
        grep -i "requires signing" rapc_output.txt > security-api-report.txt || true
        grep -i "Warning!:" rapc_output.txt >> security-api-report.txt || true
        echo "RAPC Security Report Generated:"
        cat security-api-report.txt

    - name: 📦 Sauvegarde des artefacts
      uses: actions/upload-artifact@v4
      with:
        name: BBSB_BlackBerry_App_5.0.0
        path: |
          blackberry/*.cod
          blackberry/*.jad
          blackberry/*.alx
          blackberry/*.jar
          blackberry/security-api-report.txt
          blackberry/rapc_output.txt
