name: Experimental BlackBerry OS 7 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ☕ Setup Java 8 (32-bit requis pour RAPC)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: x86

    - name: 🛠️ Setup Apache Ant
      shell: powershell
      run: |
        Write-Host "Installation d'Apache Ant..."
        choco install ant -y --no-progress
        # Choco ajoute automatiquement Ant au PATH, mais on s'assure que c'est bien disponible

    - name: 🚀 Téléchargement et Extraction Expérimentale du JDE 7.1.0
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $url = "https://archive.org/download/blackberry-jde/BlackBerry_JDE_7.1.0.exe"
        $exePath = "C:\JDE_Installer\BlackBerry_JDE_7.1.0.exe"
        $extractPath = "C:\JDE_Extract"
        $finalJdePath = "C:\BlackBerry_JDE"
        
        New-Item -ItemType Directory -Force -Path "C:\JDE_Installer" | Out-Null
        New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
        
        Write-Host "========================================="
        Write-Host "1. TÉLÉCHARGEMENT DU JDE 7.1.0"
        Write-Host "========================================="
        Write-Host "Téléchargement depuis: $url"
        
        try {
            Invoke-WebRequest -Uri $url -OutFile $exePath
            $fileInfo = Get-Item $exePath
            Write-Host "Fichier téléchargé avec succès. Taille : $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
            
            # Vérification basique de l'intégrité (l'installeur JDE 7.1 fait environ 300Mo)
            if ($fileInfo.Length -lt 150MB) {
                throw "Le fichier téléchargé est trop petit, il est probablement corrompu."
            }
        } catch {
            Write-Error "Échec du téléchargement du JDE. Cause : $_"
            exit 1
        }
        
        Write-Host "`n========================================="
        Write-Host "2. EXTRACTION EXPERIMENTALE (Multi-méthodes)"
        Write-Host "========================================="
        
        $msiFound = $false
        
        Write-Host "-> Méthode A : Extraction InstallShield native (/s /x)"
        try {
            $process = Start-Process -FilePath $exePath -ArgumentList "/s", "/x", "/b`"$extractPath`"", "/v`"/qn`"" -PassThru
            $process.WaitForExit(120000) # Attendre max 2 minutes (120 000 ms)
            
            $msiFile = Get-ChildItem -Path $extractPath -Filter "*.msi" -Recurse | Select-Object -First 1
            if ($msiFile) {
                Write-Host "[SUCCÈS] MSI trouvé via Méthode A : $($msiFile.FullName)"
                $msiFound = $true
            } else {
                Write-Host "[ÉCHEC] Aucun MSI trouvé après la Méthode A."
            }
        } catch {
            Write-Host "[ÉCHEC] Erreur lors de la Méthode A : $_"
        }
        
        if (-not $msiFound) {
            Write-Host "`n-> Méthode B : Extraction forcée via 7-Zip"
            try {
                # 7-Zip est préinstallé sur windows-latest
                & 7z x $exePath -o"$extractPath\7z_extracted" -y | Out-Null
                $msiFile = Get-ChildItem -Path "$extractPath\7z_extracted" -Filter "*.msi" -Recurse | Select-Object -First 1
                if ($msiFile) {
                    Write-Host "[SUCCÈS] MSI trouvé via Méthode B : $($msiFile.FullName)"
                    $msiFound = $true
                } else {
                    Write-Host "[ÉCHEC] 7-Zip n'a pas pu extraire de fichier MSI."
                }
            } catch {
                Write-Host "[ÉCHEC] Erreur lors de la Méthode B : $_"
            }
        }
        
        if ($msiFound) {
            Write-Host "`n-> Lancement de l'Installation Administrative (Extraction pure des binaires)..."
            try {
                # msiexec /a force l'extraction du contenu de l'MSI vers le dossier cible sans rien installer sur le système
                $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/a", "`"$($msiFile.FullName)`"", "/qn", "TARGETDIR=`"$finalJdePath`"" -PassThru
                $msiProcess.WaitForExit(300000) # Max 5 minutes
                Write-Host "Extraction MSI terminée."
            } catch {
                Write-Error "Échec de l'installation administrative MSI : $_"
                exit 1
            }
        } else {
            Write-Error "Toutes les méthodes d'extraction ont échoué. Impossible de récupérer le JDE."
            exit 1
        }
        
        Write-Host "`n========================================="
        Write-Host "3. VÉRIFICATION DES OUTILS DE COMPILATION"
        Write-Host "========================================="
        
        # Recherche récursive pour ne pas dépendre d'une structure de dossier stricte
        $rapcExe = Get-ChildItem -Path $finalJdePath -Filter "rapc.exe" -Recurse | Select-Object -First 1
        $netRimApi = Get-ChildItem -Path $finalJdePath -Filter "net_rim_api.jar" -Recurse | Select-Object -First 1
        
        if ($rapcExe -and $netRimApi) {
            Write-Host "[SUCCÈS] Tous les outils requis ont été trouvés !"
            Write-Host "- RAPC.exe : $($rapcExe.FullName)"
            Write-Host "- NET_RIM_API.jar : $($netRimApi.FullName)"
            
            # Définition dynamique du JDE_HOME en fonction de l'endroit où rapc.exe a été trouvé
            $jdeHome = $rapcExe.Directory.Parent.FullName
            Write-Host "`nConfiguration de BLACKBERRY_JDE_HOME=$jdeHome"
            
            # Injection dans l'environnement GitHub Actions pour l'étape suivante
            echo "BLACKBERRY_JDE_HOME=$jdeHome" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Write-Error "Extraction réussie mais fichiers critiques manquants !"
            Write-Host "Contenu trouvé dans $finalJdePath :"
            Get-ChildItem -Path $finalJdePath -Recurse | Select-Object FullName
            exit 1
        }

    - name: ⚙️ Compilation du projet BlackBerry (BBSB)
      shell: bash
      run: |
        echo "========================================="
        echo "4. DÉMARRAGE DE LA COMPILATION"
        echo "========================================="
        echo "Dossier JDE actif détecté : $BLACKBERRY_JDE_HOME"
        
        # Le script s'adapte automatiquement selon que le code est à la racine ou dans un sous-dossier "blackberry"
        if [ -d "blackberry" ] && [ -f "blackberry/build.xml" ]; then
          echo "Dossier 'blackberry' trouvé, navigation vers le dossier source..."
          cd blackberry
        elif [ -f "build.xml" ]; then
          echo "build.xml trouvé à la racine du projet."
        else
          echo "ERREUR CRITIQUE : Fichier build.xml introuvable dans le dépôt !"
          ls -la
          exit 1
        fi
        
        echo "Lancement de Apache Ant avec BLACKBERRY_JDE_HOME=$BLACKBERRY_JDE_HOME..."
        ant build
        
        echo "Compilation terminée !"

    - name: 📦 Sauvegarde des artefacts générés (.cod, .jad, .alx, .jar)
      uses: actions/upload-artifact@v4
      if: always() # Toujours s'exécuter même en cas d'échec pour permettre le debug
      with:
        name: BBSB_BlackBerry_App_7.1.0
        path: |
          **/*.cod
          **/*.jad
          **/*.alx
          **/*.jar
        retention-days: 7
