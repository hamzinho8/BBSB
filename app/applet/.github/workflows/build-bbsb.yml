name: BlackBerry OS 7 Build (Anti-Hang)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ☕ Setup Java 8 (32-bit requis pour RAPC)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: x86

    - name: 🛠️ Setup Apache Ant
      shell: powershell
      run: |
        choco install ant -y --no-progress

    - name: 🚀 Téléchargement du JDE 7.1.0
      shell: powershell
      run: |
        $url = "https://archive.org/download/blackberry-jde/BlackBerry_JDE_7.1.0.exe"
        $exePath = "C:\BlackBerry_JDE_7.1.0.exe"
        Write-Host "Téléchargement en cours..."
        Invoke-WebRequest -Uri $url -OutFile $exePath
        Write-Host "Téléchargement terminé."

    - name: 📦 Extraction Silencieuse (Bypass de l'Installeur)
      shell: powershell
      run: |
        $extractPath = "C:\JDE_Extract"
        $finalJdePath = "C:\BlackBerry_JDE"
        New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
        
        Write-Host "1. Extraction du fichier MSI depuis l'EXE InstallShield..."
        # Demande à InstallShield d'extraire le MSI sans l'exécuter
        $process = Start-Process -FilePath "C:\BlackBerry_JDE_7.1.0.exe" -ArgumentList "/s", "/x", "/b`"C:\JDE_Extract`"", "/v`"/qn`"" -PassThru
        
        # On attend maximum 2 minutes pour l'extraction
        $process.WaitForExit(120000)
        
        $msiFile = Get-ChildItem -Path $extractPath -Filter "*.msi" -Recurse | Select-Object -First 1
        if (-not $msiFile) {
            Write-Error "Le fichier MSI n'a pas pu être extrait."
            exit 1
        }
        Write-Host "MSI extrait avec succès : $($msiFile.FullName)"
        
        Write-Host "2. Installation Administrative (Décompression pure, aucun prérequis Java testé)..."
        # msiexec /a force l'extraction des fichiers de l'application sans lancer l'installation réelle
        $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/a", "`"$($msiFile.FullName)`"", "/qn", "TARGETDIR=`"$finalJdePath`"" -PassThru
        $msiProcess.WaitForExit(300000)
        Write-Host "Décompression terminée."

    - name: 🔍 Configuration du JDE
      shell: powershell
      run: |
        Write-Host "Recherche des outils de compilation..."
        $rapcExe = Get-ChildItem -Path "C:\BlackBerry_JDE" -Filter "rapc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if ($rapcExe) {
            $jdeHome = $rapcExe.Directory.Parent.FullName
            Write-Host "Outils trouvés dans : $jdeHome"
            Write-Host "BLACKBERRY_JDE_HOME=$jdeHome" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Write-Error "Échec : rapc.exe introuvable."
            exit 1
        }

    - name: ⚙️ Compilation du projet BlackBerry
      shell: bash
      run: |
        echo "Lancement de ant avec BLACKBERRY_JDE_HOME=$BLACKBERRY_JDE_HOME"
        # On se place dans le dossier contenant build.xml
        if [ -d "blackberry" ] && [ -f "blackberry/build.xml" ]; then
          cd blackberry
        elif [ -f "build.xml" ]; then
          echo "build.xml trouvé à la racine"
        else
          echo "ERREUR : Fichier build.xml introuvable."
          exit 1
        fi
        ant build

    - name: 📦 Sauvegarde des artefacts
      uses: actions/upload-artifact@v4
      with:
        name: BBSB_BlackBerry_App_7.1.0
        path: |
          **/*.cod
          **/*.jad
          **/*.alx
          **/*.jar
