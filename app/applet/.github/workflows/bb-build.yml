name: BlackBerry OS 7 Build Automatisé

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (Version 32-bit requise pour BlackBerry)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: x86

    - name: Download BlackBerry JDE SDK
      shell: powershell
      run: |
        echo "Téléchargement du BlackBerry JDE..."
        Invoke-WebRequest -Uri "https://archive.org/download/blackberry-jde-5.0.0/BlackBerry_JDE_5.0.0.zip" -OutFile "jde.zip"
        echo "Extraction en cours..."
        Expand-Archive -Path jde.zip -DestinationPath C:\BlackBerry_JDE

    - name: Compilation avec Apache Ant
      env:
        BLACKBERRY_JDE_HOME: "C:\\BlackBerry_JDE"
      run: |
        cd blackberry
        ant build

    - name: Upload Artifacts (Fichiers d'installation)
      uses: actions/upload-artifact@v3
      with:
        name: BlackBerrySmartBridge_App
        path: |
          blackberry/*.cod
          blackberry/*.jad
          blackberry/*.alx
