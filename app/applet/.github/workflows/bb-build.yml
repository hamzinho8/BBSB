name: BlackBerry OS 7 Build Automatisé

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (Version 32-bit requise pour BlackBerry)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: x86

    - name: Download and Extract BlackBerry JDE SDK
      shell: powershell
      run: |
        echo "Téléchargement du BlackBerry JDE officiel (.exe)..."
        Invoke-WebRequest -Uri "https://archive.org/download/blackberry-jde-5.0.0/BlackBerry_JDE_5.0.0.exe" -OutFile "jde_installer.exe"
        
        echo "Extraction des fichiers d'installation (Contournement de l'installeur silencieux qui bloque)..."
        New-Item -ItemType Directory -Path "C:\JDE_Extract" | Out-Null
        
        # InstallShield /x extrait l'MSI et le CAB sans lancer l'installation
        $process = Start-Process -FilePath ".\jde_installer.exe" -ArgumentList "/s", "/x", "/b`"C:\JDE_Extract`"", "/v`"/qn`"" -PassThru
        $process.WaitForExit()
        
        echo "Recherche du fichier MSI extrait..."
        $msiFile = Get-ChildItem -Path "C:\JDE_Extract" -Filter "*.msi" -Recurse | Select-Object -First 1
        
        if ($msiFile) {
            echo "MSI trouvé: $($msiFile.FullName)"
            echo "Installation administrative silencieuse (Extraction des binaires purs)..."
            
            # msiexec /a effectue une installation administrative (extraction des fichiers sans enregistrement système)
            $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/a", "`"$($msiFile.FullName)`"", "/qn", "TARGETDIR=`"C:\BlackBerry_JDE`"" -PassThru
            $msiProcess.WaitForExit()
            
            echo "Vérification de l'extraction..."
            if (Test-Path "C:\BlackBerry_JDE\bin\rapc.exe") {
                echo "JDE extrait avec succès dans C:\BlackBerry_JDE"
            } elseif (Test-Path "C:\BlackBerry_JDE\BlackBerry JDE 5.0.0\bin\rapc.exe") {
                echo "JDE extrait dans un sous-dossier, création d'un lien..."
                New-Item -ItemType Junction -Path "C:\BlackBerry_JDE_Link" -Target "C:\BlackBerry_JDE\BlackBerry JDE 5.0.0" | Out-Null
            } else {
                echo "Erreur: rapc.exe introuvable après l'extraction."
                Get-ChildItem "C:\BlackBerry_JDE" -Recurse
                exit 1
            }
        } else {
            echo "Erreur: Le fichier MSI n'a pas pu être extrait."
            exit 1
        }

    - name: Compilation avec Apache Ant
      shell: bash
      env:
        BLACKBERRY_JDE_HOME: "C:\\BlackBerry_JDE_Link"
      run: |
        cd blackberry
        
        # Si le lien n'existe pas, c'est que les fichiers sont à la racine
        if [ ! -d "$BLACKBERRY_JDE_HOME" ]; then
          export BLACKBERRY_JDE_HOME="C:\\BlackBerry_JDE"
        fi
        
        echo "Lancement de la compilation avec BLACKBERRY_JDE_HOME=$BLACKBERRY_JDE_HOME"
        ant build

    - name: Upload Artifacts (Fichiers d'installation)
      uses: actions/upload-artifact@v4
      with:
        name: BlackBerrySmartBridge_App
        path: |
          blackberry/*.cod
          blackberry/*.jad
          blackberry/*.alx
